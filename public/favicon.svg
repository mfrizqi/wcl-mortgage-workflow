<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="#0b1320"/>
  
  <!-- Subtle inner border line -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.12" stroke-width="2"/>
  
  <!-- Geometric "W" with Gradient -->
  <path d="M16 20L23.5 44L32 28L40.5 44L48 20" 
        stroke="url(#w_gradient)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Accent Dot (symbolizing automation/spark) -->
  <circle cx="48" cy="18" r="3" fill="#2ecc8f"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="w_gradient" x1="16" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#2ecc8f"/>
      <stop offset="100%" stop-color="#1f5fb8"/>
    </linearGradient>
  </defs>
</svg>
